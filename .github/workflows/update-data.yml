name: Update Competitor Intel Data

on:
  schedule:
    # Run at 06:00 UTC and 18:00 UTC daily (twice/day)
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Fetch competitor data
        working-directory: ./scripts
        run: node fetch-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json, skipping commit"
          else
            git commit -m "chore: update competitor data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
